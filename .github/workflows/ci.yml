name: Python CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: python -m pytest
      - run: python -m ruff check src/agentic_trading/risk_engine.py tests/test_risk_engine.py
      - run: python -m ruff check src/agentic_trading/market_data tests/test_market_data_models.py tests/test_market_data_quality.py
